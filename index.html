<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Lượng giá - Khảo sát">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#3b82f6">
    <meta name="description" content="Ứng dụng lượng giá và khảo sát - Phòng QLCL BV Nhi đồng TP. Cần Thơ">
    <title>Lượng giá - Khảo sát | BV Nhi đồng Cần Thơ</title>

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>">
    <link rel="apple-touch-icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
        }

        .btn-qlcl {
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
        }

        .btn-tyc {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
        }

        .star-btn {
            transition: transform 0.15s;
        }

        .star-btn:hover {
            transform: scale(1.2);
        }

        .slide-up {
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .toast {
            animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in 2.7s;
        }

        @keyframes toastIn {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes toastOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        input,
        select,
        textarea {
            font-size: 16px !important;
        }

        .spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .card-hover {
            transition: all 0.2s;
        }

        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        .safe-top {
            padding-top: env(safe-area-inset-top, 0px);
        }
    </style>
</head>

<body class="bg-gradient-to-br from-blue-50 via-white to-purple-50 min-h-screen">
    <div id="app">
        <div class="min-h-screen flex items-center justify-center">
            <div class="text-center">
                <i class="fas fa-spinner spinner text-4xl text-blue-500 mb-4"></i>
                <p class="text-gray-500">Đang tải ứng dụng...</p>
            </div>
        </div>
    </div>

    <script>
        // ===================== FIREBASE CONFIG =====================
        // ⚠️ THAY ĐỔI CẤU HÌNH FIREBASE CỦA BẠN TẠI ĐÂY
        const firebaseConfig = {
            apiKey: "AIzaSyBNIsKl8KHl0-CpwZn-R504uAKvFN6A8AQ",
            authDomain: "ks-checklist-bvnhidong.firebaseapp.com",
            databaseURL: "https://ks-checklist-bvnhidong-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ks-checklist-bvnhidong",
            storageBucket: "ks-checklist-bvnhidong.firebasestorage.app",
            messagingSenderId: "1073910974970",
            appId: "1:1073910974970:web:a9a0f9c360918226357c43"
        };

        // ===================== DEFAULT ADMIN =====================
        const DEFAULT_ADMIN = {
            username: 'admin',
            password: 'admin@123',
            name: 'Quản trị viên',
            role: 'admin'
        };

        // Initialize Firebase
        let db;
        let firebaseReady = false;

        try {
            if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                firebaseReady = true;
            }
        } catch (error) {
            console.error('Firebase init error:', error);
        }

        // ===================== DEFAULT INFO FIELDS =====================
        const DEFAULT_INFO_FIELDS = [
            { id: 'customerName', label: 'Tên khách hàng', type: 'text', required: true },
            { id: 'clinic', label: 'Phòng khám', type: 'select', options: 'clinics', required: true },
            { id: 'doctorName', label: 'Bác sĩ', type: 'text', required: false },
            { id: 'surveyorName', label: 'Người khảo sát', type: 'text', required: true }
        ];

        const LUONG_GIA_INFO_FIELDS = [
            { id: 'department', label: 'Khoa/Phòng kiểm tra', type: 'text', required: true },
            { id: 'targetPerson', label: 'Người được giám sát', type: 'text', required: true },
            { id: 'supervisorName', label: 'Người giám sát', type: 'text', required: true },
            { id: 'checkDate', label: 'Ngày kiểm tra', type: 'date', required: true }
        ];

        const DEFAULT_LUONG_GIA_CATEGORIES = [
            { id: 'quy_trinh', name: 'Quy trình', icon: '📋' },
            { id: '5s', name: '5S', icon: '🏥' },
            { id: 'scyk', name: 'SCYK', icon: '⚠️' },
            { id: 'khac', name: 'Khác', icon: '📝' }
        ];

        const getLuongGiaCategories = () => APP.config.luongGiaCategories || DEFAULT_LUONG_GIA_CATEGORIES;
        // Alias for compatibility
        const LUONG_GIA_CATEGORIES = DEFAULT_LUONG_GIA_CATEGORIES;

        // ===================== APP STATE =====================
        const APP = {
            currentUser: null,
            currentModule: 'home',
            activeSubsystem: 'QLCL',
            currentSurvey: null,
            notification: null,
            loading: false,
            editingQuestionSet: null,
            users: [],
            questionSets: [],
            surveys: [],
            clinics: [],
            config: { telegramBotToken: '', telegramChatId: '', hospitalName: 'Bệnh viện Nhi đồng TP. Cần Thơ' },
            filterDate: { from: '', to: '' },
            selectedQuestionSet: null,
            homeFilter: 'all', // all, survey, luong_gia, luong_gia_quy_trinh, luong_gia_5s, luong_gia_scyk, luong_gia_khac
            reportTypeFilter: 'all' // all, survey, luong_gia
        };

        // ===================== UTILITY =====================
        const showNotification = (msg, type = 'success') => {
            APP.notification = { message: msg, type };
            render();
            setTimeout(() => { APP.notification = null; render(); }, 3000);
        };

        const showLoading = (show = true) => { APP.loading = show; render(); };

        const hasNegativeFeedback = (s) => s.answers?.some(a => a.type === 'rating' && a.value <= 2);

        const formatDate = (ts) => {
            if (!ts) return '';
            const d = ts.toDate ? ts.toDate() : new Date(ts);
            return d.toLocaleString('vi-VN');
        };

        const hashPassword = (str) => {
            let h = 0;
            for (let i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h = h & h; }
            return 'h' + Math.abs(h).toString(16);
        };

        // ===================== AUTH =====================
        const initializeAdmin = async () => {
            try {
                const snap = await db.ref('users/admin').once('value');
                if (!snap.exists()) {
                    await db.ref('users/admin').set({
                        username: DEFAULT_ADMIN.username,
                        password: hashPassword(DEFAULT_ADMIN.password),
                        name: DEFAULT_ADMIN.name,
                        role: DEFAULT_ADMIN.role,
                        createdAt: Date.now()
                    });
                }
            } catch (e) { console.error('Init admin:', e); }
        };

        const login = async (username, password) => {
            try {
                showLoading(true);
                const snap = await db.ref('users').orderByChild('username').equalTo(username.toLowerCase().trim()).once('value');
                if (!snap.exists()) { showNotification('Tài khoản không tồn tại!', 'error'); return false; }
                let userData, odId;
                snap.forEach(child => { odId = child.key; userData = child.val(); });
                if (userData.password !== hashPassword(password)) { showNotification('Sai mật khẩu!', 'error'); return false; }
                APP.currentUser = { id: odId, ...userData };
                APP.activeSubsystem = userData.role === 'admin' ? 'QLCL' : userData.role.toUpperCase();
                localStorage.setItem('survey_session', JSON.stringify({ odId, username: userData.username }));
                await loadAllData();
                showNotification(`Xin chào, ${userData.name}!`);
                return true;
            } catch (e) { showNotification('Lỗi đăng nhập!', 'error'); return false; }
            finally { showLoading(false); }
        };

        const checkSession = async () => {
            try {
                const s = localStorage.getItem('survey_session');
                if (!s) return false;
                const { odId } = JSON.parse(s);
                const snap = await db.ref('users/' + odId).once('value');
                if (!snap.exists()) { localStorage.removeItem('survey_session'); return false; }
                APP.currentUser = { id: odId, ...snap.val() };
                APP.activeSubsystem = APP.currentUser.role === 'admin' ? 'QLCL' : APP.currentUser.role.toUpperCase();
                return true;
            } catch (e) { return false; }
        };

        const logout = () => {
            APP.currentUser = null;
            APP.currentModule = 'home';
            localStorage.removeItem('survey_session');
            showNotification('Đã đăng xuất!');
            render();
        };

        // ===================== USER MANAGEMENT =====================
        const createUser = async (username, password, name, role) => {
            try {
                showLoading(true);
                const snap = await db.ref('users').orderByChild('username').equalTo(username.toLowerCase().trim()).once('value');
                if (snap.exists()) { showNotification('Tên đăng nhập đã tồn tại!', 'error'); return false; }
                const id = username.toLowerCase().trim() + '_' + Date.now();
                await db.ref('users/' + id).set({
                    username: username.toLowerCase().trim(),
                    password: hashPassword(password),
                    name: name.trim(),
                    role,
                    createdAt: Date.now(),
                    createdBy: APP.currentUser.id
                });
                await loadUsers();
                showNotification('Tạo tài khoản thành công!');
                return true;
            } catch (e) { showNotification('Lỗi tạo tài khoản!', 'error'); return false; }
            finally { showLoading(false); }
        };

        const deleteUser = async (id) => {
            if (id === 'admin') { showNotification('Không thể xóa admin gốc!', 'error'); return; }
            try {
                await db.ref('users/' + id).remove();
                await loadUsers();
                showNotification('Đã xóa!');
            } catch (e) { showNotification('Lỗi!', 'error'); }
        };

        const changePassword = async (id, newPwd) => {
            try {
                await db.ref('users/' + id).update({ password: hashPassword(newPwd) });
                showNotification('Đã đổi mật khẩu!');
            } catch (e) { showNotification('Lỗi!', 'error'); }
        };

        // ===================== DATA LOADING =====================
        const loadAllData = async () => {
            await Promise.all([loadConfig(), loadUsers(), loadClinics(), loadQuestionSets(), loadSurveys()]);
        };

        const loadConfig = async () => {
            try {
                const snap = await db.ref('settings/config').once('value');
                if (snap.exists()) APP.config = { ...APP.config, ...snap.val() };
            } catch (e) { }
        };

        const saveConfig = async () => {
            try {
                await db.ref('settings/config').set(APP.config);
                showNotification('Đã lưu!');
            } catch (e) { showNotification('Lỗi!', 'error'); }
        };

        const loadUsers = async () => {
            try {
                const snap = await db.ref('users').once('value');
                APP.users = [];
                snap.forEach(child => { APP.users.push({ id: child.key, ...child.val() }); });
                APP.users.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            } catch (e) { }
        };

        const loadClinics = async () => {
            try {
                const snap = await db.ref('clinics').once('value');
                APP.clinics = [];
                snap.forEach(child => { APP.clinics.push({ id: child.key, ...child.val() }); });
                APP.clinics.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                if (APP.clinics.length === 0 && APP.currentUser?.role === 'admin') {
                    const defs = ['Phòng khám Nhi tổng quát', 'Phòng khám Tai Mũi Họng', 'Phòng khám Mắt', 'Phòng khám Da liễu', 'Phòng khám Tim mạch', 'Phòng khám Hô hấp', 'Phòng khám Tiêu hóa', 'Phòng khám Thần kinh', 'Phòng khám Cấp cứu'];
                    for (const n of defs) await db.ref('clinics').push({ name: n });
                    await loadClinics();
                }
            } catch (e) { }
        };

        const loadQuestionSets = async () => {
            try {
                const snap = await db.ref('questionSets').once('value');
                APP.questionSets = [];
                snap.forEach(child => { APP.questionSets.push({ id: child.key, ...child.val() }); });
                APP.questionSets.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                if (APP.questionSets.length === 0 && APP.currentUser?.role === 'admin') {
                    await createDefaultQuestionSets();
                    await loadQuestionSets();
                }
            } catch (e) { }
        };

        const createDefaultQuestionSets = async () => {
            const defs = {
                QLCL: {
                    name: 'Bộ câu hỏi QLCL mặc định',
                    type: 'survey',
                    infoFields: JSON.parse(JSON.stringify(DEFAULT_INFO_FIELDS)),
                    questions: [
                        { id: 1, text: 'Thái độ phục vụ của nhân viên y tế', type: 'rating', required: true },
                        { id: 2, text: 'Thời gian chờ đợi khám bệnh', type: 'rating', required: true },
                        { id: 3, text: 'Cơ sở vật chất, trang thiết bị', type: 'rating', required: true },
                        { id: 4, text: 'Hướng dẫn quy trình khám chữa bệnh', type: 'rating', required: true },
                        { id: 5, text: 'Mức độ hài lòng chung', type: 'rating', required: true },
                        { id: 6, text: 'Góp ý, đề xuất khác', type: 'text', required: false }
                    ]
                },
                TYC: {
                    name: 'Bộ câu hỏi TYC mặc định',
                    type: 'survey',
                    infoFields: JSON.parse(JSON.stringify(DEFAULT_INFO_FIELDS)),
                    questions: [
                        { id: 1, text: 'Quy trình đăng ký khám có thuận tiện không?', type: 'rating', required: true },
                        { id: 2, text: 'Thái độ của nhân viên tiếp đón', type: 'rating', required: true },
                        { id: 3, text: 'Bác sĩ giải thích tình trạng bệnh rõ ràng không?', type: 'rating', required: true },
                        { id: 4, text: 'Thời gian khám có phù hợp không?', type: 'rating', required: true },
                        { id: 5, text: 'Bạn có giới thiệu người thân đến khám không?', type: 'yesno', required: true },
                        { id: 6, text: 'Ý kiến đóng góp', type: 'text', required: false }
                    ]
                }
            };
            for (const [sub, data] of Object.entries(defs)) {
                await db.ref('questionSets').push({ ...data, subsystem: sub, isDefault: true, createdAt: Date.now() });
            }
        };

        const loadSurveys = async () => {
            try {
                const snap = await db.ref('surveys').limitToLast(500).once('value');
                APP.surveys = [];
                snap.forEach(child => { APP.surveys.push({ id: child.key, ...child.val() }); });
                APP.surveys.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            } catch (e) { }
        };

        const createQuestionSet = async (name, subsystem, questions) => {
            try {
                showLoading(true);
                await db.ref('questionSets').push({ name, subsystem, questions, isDefault: false, createdAt: Date.now() });
                await loadQuestionSets();
                showNotification('Đã tạo!');
                return true;
            } catch (e) { showNotification('Lỗi!', 'error'); return false; }
            finally { showLoading(false); }
        };

        const updateQuestionSet = async (id, data) => {
            try {
                await db.ref('questionSets/' + id).update(data);
                await loadQuestionSets();
                showNotification('Đã cập nhật!');
            } catch (e) { showNotification('Lỗi!', 'error'); }
        };

        const deleteQuestionSet = async (id) => {
            try {
                await db.ref('questionSets/' + id).remove();
                await loadQuestionSets();
                showNotification('Đã xóa!');
            } catch (e) { showNotification('Lỗi!', 'error'); }
        };

        const saveSurvey = async (survey) => {
            try {
                showLoading(true);
                const newRef = await db.ref('surveys').push({ ...survey, timestamp: Date.now(), createdBy: APP.currentUser.id });
                survey.id = newRef.key;
                await loadSurveys();
                return survey;
            } catch (e) { showNotification('Lỗi!', 'error'); return null; }
            finally { showLoading(false); }
        };

        const addClinic = async (name) => { try { await db.ref('clinics').push({ name }); await loadClinics(); showNotification('Đã thêm!'); } catch (e) { showNotification('Lỗi!', 'error'); } };
        const updateClinic = async (id, name) => { try { await db.ref('clinics/' + id).update({ name }); await loadClinics(); } catch (e) { } };
        const deleteClinic = async (id) => { try { await db.ref('clinics/' + id).remove(); await loadClinics(); showNotification('Đã xóa!'); } catch (e) { } };

        // ===================== TELEGRAM =====================
        const sendTelegramAlert = async (survey) => {
            if (!APP.config.telegramBotToken || !APP.config.telegramChatId) { showNotification('Chưa cấu hình Telegram!', 'error'); return false; }
            const low = survey.answers.filter(a => a.type === 'rating' && a.value <= 2);
            const txt = survey.answers.find(a => a.type === 'text' && a.value);
            const msg = `🚨 *CẢNH BÁO PHẢN HỒI KHÔNG TỐT*\n\n📋 *Phân hệ:* ${survey.subsystem === 'QLCL' ? 'Phòng QLCL' : 'BQL Khám TYC'}\n📝 *Bộ câu hỏi:* ${survey.questionSetName || 'Mặc định'}\n👤 *Khách hàng:* ${survey.customerName}\n🏥 *Phòng khám:* ${survey.clinic}\n👨‍⚕️ *Bác sĩ:* ${survey.doctorName || 'Không có'}\n📝 *Người khảo sát:* ${survey.surveyorName}\n🕐 *Thời gian:* ${new Date().toLocaleString('vi-VN')}\n\n⚠️ *Các mục đánh giá thấp:*\n${low.map(r => `• ${r.question}: ${r.value}/5 ⭐`).join('\n')}${txt ? `\n\n💬 *Góp ý:* ${txt.value}` : ''}`;
            try {
                const res = await fetch(`https://api.telegram.org/bot${APP.config.telegramBotToken}/sendMessage`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: APP.config.telegramChatId, text: msg, parse_mode: 'Markdown' })
                });
                if (res.ok) {
                    showNotification('Đã gửi cảnh báo!');
                    if (survey.id) await db.ref('surveys/' + survey.id).update({ telegramSent: true });
                    return true;
                }
                throw new Error();
            } catch (e) { showNotification('Lỗi gửi Telegram!', 'error'); return false; }
        };

        // ===================== EXPORT =====================
        const formatAnswerValue = (a) => {
            if (a.type === 'rating') return `${a.value}/5`;
            if (a.type === 'yesno') return a.value === 'yes' ? 'Có' : (a.value === 'no' ? 'Không' : '');
            if (a.type === 'scoring') return a.value === '2' ? 'Đạt (2đ)' : a.value === '1' ? 'Đạt 1 phần (1đ)' : a.value === '0' ? 'Không đạt (0đ)' : a.value === 'na' ? 'K.Áp dụng' : '';
            return a.value || '';
        };

        const exportToCSV = () => {
            const filtered = getFilteredSurveys();
            if (filtered.length === 0) { showNotification('Không có dữ liệu!', 'error'); return; }
            const allQ = new Set();
            filtered.forEach(s => s.answers?.forEach(a => allQ.add(a.question)));
            const headers = ['STT', 'Phân hệ', 'Bộ câu hỏi', 'Loại', 'Thông tin chính', 'Thông tin phụ', 'Thời gian', ...Array.from(allQ), 'Điểm số', 'Tỷ lệ %', 'Xếp loại', 'Kết luận', 'Đã báo cáo'];
            const rows = filtered.map((s, i) => {
                const v = {};
                s.answers?.forEach(a => v[a.question] = formatAnswerValue(a));
                const d = s.infoData || {};
                const mainInfo = d.customerName || d.department || d.targetPerson || s.customerName || '';
                const subInfo = d.clinic || d.supervisorName || s.clinic || '';
                const qs = APP.questionSets.find(q => q.id === s.questionSetId);
                const typeLabel = qs?.type === 'luong_gia' ? 'Lượng giá' : 'Khảo sát';
                const sc = s.scoreData || {total: '', max: '', percentage: '', classification: ''};
                return [i + 1, s.subsystem, s.questionSetName || '', typeLabel, mainInfo, subInfo, formatDate(s.timestamp), ...Array.from(allQ).map(q => v[q] || ''), sc.max ? `${sc.total}/${sc.max}` : '', sc.percentage || '', sc.classification || '', s.conclusion || '', s.telegramSent ? 'Có' : 'Không'];
            });
            const csv = '\uFEFF' + [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `BaoCao_${APP.activeSubsystem}_${new Date().toISOString().slice(0, 10)}.csv`;
            link.click();
            showNotification('Đã xuất file CSV!');
        };

        const exportToReport = () => {
            const filtered = getFilteredSurveys();
            if (filtered.length === 0) { showNotification('Không có dữ liệu!', 'error'); return; }
            const stats = getStatistics();

            for (const [q, v] of Object.entries(rq)) stats.avgRatings[q] = v.length > 0 ? (v.reduce((a, b) => a + b, 0) / v.length).toFixed(2) : 0;
            return stats;
        };

        const getSubsystemQuestionSets = () => APP.questionSets.filter(qs => qs.subsystem === APP.activeSubsystem);

        const calculateScore = (answers, qs) => {
            if (!answers) return null;
            let total = 0, max = 0, has = false;
            answers.forEach(a => {
                if (a.type === 'scoring' && a.value !== '' && a.value !== undefined) {
                    has = true;
                    if (a.value !== 'na') { max += 2; total += parseInt(a.value); }
                }
            });
            if (!has) return null;
            const p = max > 0 ? (total / max) * 100 : 0;
            
            let c = 'Không đạt';
            const rules = qs?.scoreRules || [
                { min: 90, label: 'Xuất sắc' },
                { min: 80, label: 'Tốt' },
                { min: 65, label: 'Khá' },
                { min: 50, label: 'Đạt' },
                { min: 0, label: 'Không đạt' }
            ];
            const sortedRules = [...rules].sort((a, b) => b.min - a.min);
            for (const r of sortedRules) {
                if (p >= r.min) {
                    c = r.label;
                    break;
                }
            }
            return { total, max, percentage: p.toFixed(1), classification: c };

e rounded-2xl shadow-lg p-4"><h3 class="font-bold text-gray-800 mb-3 flex items-center gap-2"><i class="fas fa-chart-bar text-green-500"></i>Thống kê</h3><div class="grid grid-cols-2 gap-3 mb-4"><div class="bg-blue-50 rounded-xl p-3 text-center"><div class="text-2xl font-bold text-blue-600">${stats.total}</div><div class="text-xs text-blue-600">Tổng</div></div><div class="bg-red-50 rounded-xl p-3 text-center"><div class="text-2xl font-bold text-red-600">${stats.negative}</div><div class="text-xs text-red-600">Xấu</div></div></div>${Object.keys(conclusionStats).length > 0 ? `<div class="mb-3"><h4 class="font-medium text-gray-700 text-sm mb-2">Kết luận:</h4><div class="flex flex-wrap gap-2">${Object.entries(conclusionStats).map(([k, v]) => `<span class="text-xs px-3 py-1 rounded-full ${k === 'Đạt' || k === 'Tốt' || k === 'Xuất sắc' ? 'bg-green-100 text-green-700' : k === 'Không đạt' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'}">${k}: ${v}</span>`).join('')}</div></div>` : ''}${Object.keys(stats.avgRatings).length > 0 ? `<div class="space-y-2"><h4 class="font-medium text-gray-700 text-sm">Điểm TB:</h4>${Object.entries(stats.avgRatings).map(([k, v]) => `<div class="flex items-center gap-2"><div class="flex-1 text-sm text-gray-600 truncate">${k}</div><span class="font-bold ${v >= 4 ? 'text-green-600' : v >= 3 ? 'text-yellow-600' : 'text-red-600'}">${v}</span><span class="text-yellow-500">⭐</span><div class="w-16 h-2 bg-gray-200 rounded-full overflow-hidden"><div class="h-full ${v >= 4 ? 'bg-green-500' : v >= 3 ? 'bg-yellow-500' : 'bg-red-500'}" style="width: ${(v / 5) * 100}%"></div></div></div>`).join('')}</div>` : ''}</div>` : ''}<div class="bg-white rounded-2xl shadow-lg p-4"><div class="flex items-center justify-between mb-3 flex-wrap gap-2"><h3 class="font-bold text-gray-800 flex items-center gap-2"><i class="fas fa-list text-purple-500"></i>Danh sách (${filtered.length})</h3><div class="flex gap-2"><button onclick="exportToReport()" class="px-3 py-2 bg-blue-500 text-white rounded-xl text-sm flex items-center gap-1 hover:bg-blue-600"><i class="fas fa-file-alt"></i>Báo cáo</button><button onclick="exportToCSV()" class="px-3 py-2 bg-green-500 text-white rounded-xl text-sm flex items-center gap-1 hover:bg-green-600"><i class="fas fa-download"></i>CSV</button></div></div>${filtered.length === 0 ? `<div class="text-center py-8 text-gray-400"><i class="fas fa-clipboard-list text-4xl mb-2 opacity-50"></i><p>Chưa có</p></div>` : `<div class="space-y-2 max-h-96 overflow-y-auto">${filtered.map(s => { const info = getInfoDisplay(s); const qs = APP.questionSets.find(q => q.id === s.questionSetId); const typeIcon = qs?.type === 'luong_gia' ? '📊' : '📋'; return `<div class="p-3 rounded-xl border ${hasNegativeFeedback(s) ? 'bg-red-50 border-red-200' : 'bg-gray-50 border-gray-100'}"><div class="flex items-start justify-between"><div><div class="font-medium text-gray-800">${info.name}</div><div class="text-sm text-gray-500">${info.sub}</div><div class="text-xs text-gray-400 mt-1">${typeIcon} ${s.questionSetName || ''} • ${formatDate(s.timestamp)}</div></div><div class="flex flex-col items-end gap-1">${s.conclusion ? getConclusionBadge(s.conclusion) : ''}${!s.telegramSent ? `<button onclick="sendTelegramById('${s.id}')" class="text-xs px-2 py-1 bg-blue-500 text-white rounded-full hover:bg-blue-600 flex items-center gap-1"><i class="fab fa-telegram"></i>Gửi TG</button>` : '<span class="text-xs px-2 py-1 bg-green-100 text-green-600 rounded-full"><i class="fas fa-check"></i> Đã gửi</span>'}${hasNegativeFeedback(s) ? '<span class="text-xs px-2 py-1 bg-red-100 text-red-600 rounded-full mt-1"><i class="fas fa-exclamation-triangle"></i></span>' : ''}</div></div><div class="mt-2 flex flex-wrap gap-1">${s.answers?.filter(a => a.type === 'rating').map(a => `<span class="text-xs px-2 py-0.5 rounded-full ${a.value <= 2 ? 'bg-red-100 text-red-700' : a.value === 3 ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700'}">${a.value} 0'}">${q.type === 'rating' ? '⭐' : q.type === 'yesno' ? '✓✗' : q.type === 'scoring' ? '💯' : '📝'}</span></div>`).join('')}</div></div>`).join('')}</div>`}</div></div>`;
        };

        window.createNewQS = async () => { const n = document.getElementById('newSetName').value.trim(); if (!n) { showNotification('Nhập tên!', 'error'); return; } const ok = await createQuestionSet(n, APP.activeSubsystem, [{ id: 1, text: 'Câu hỏi mẫu', type: 'rating', required: true }]); if (ok) { document.getElementById('newSetName').value = ''; render(); } };

ữ</option><option value="date" ${f.type === 'date' ? 'selected' : ''}>Ngày</option><option value="number" ${f.type === 'number' ? 'selected' : ''}>Số</option><option value="select" ${f.type === 'select' ? 'selected' : ''}>Chọn PK</option></select><label class="flex items-center gap-1 text-sm"><input type="checkbox" ${f.required ? 'checked' : ''} onchange="APP.editingQuestionSet.infoFields[${i}].required = this.checked;" class="w-4 h-4">Bắt buộc</label><button onclick="rmInfoField(${i})" class="p-2 text-red-500 hover:bg-red-100 rounded-lg"><i class="fas fa-trash"></i></button></div>`).join('')}</div><div class="flex gap-2"><button onclick="addInfoField()" class="flex-1 py-2 border-2 border-dashed border-gray-300 rounded-xl text-gray-500 hover:border-blue-500 hover:text-blue-500 text-sm"><i class="fas fa-plus mr-1"></i>Thêm trường</button><button onclick="resetInfoFields()" class="px-3 py-2 bg-gray-100 text-gray-600 rounded-xl text-sm hover:bg-gray-200">Reset mặc định</button></div></div><div class="bg-white rounded-2xl shadow-lg p-4"><h4 class="font-semibold text-gray-800 mb-3 flex items-center gap-2"><i class="fas fa-sort-amount-up text-purple-500"></i>Thang điểm xếp loại (Dành cho câu Tính điểm)</h4><div class="space-y-2 mb-3">${qs.scoreRules.map((r, i) => `<div class="p-3 bg-gray-50 rounded-xl flex items-center gap-2"><span class="text-sm">>=</span><input type="number" value="${r.min}" onchange="APP.editingQuestionSet.scoreRules[${i}].min = Number(this.value);" class="w-16 p-2 border border-gray-200 rounded-lg text-sm" placeholder="%"><span class="text-sm">%</span><input type="text" value="${r.label}" onchange="APP.editingQuestionSet.scoreRules[${i}].label = this.value;" class="flex-1 p-2 border border-gray-200 rounded-lg text-sm" placeholder="Xếp loại"><button onclick="rmScoreRule(${i})" class="p-2 text-red-500 hover:bg-red-100 rounded-lg"><i class="fas fa-trash"></i></button></div>`).join('')}</div><button onclick="addScoreRule()" class="w-full py-2 border-2 bor ý Chất lượng</p><p class="text-xs">Tác giả: BS. Kiều Việt Tiến Hưng</p></div></div>`;

                <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-40 safe-bottom"><div class="max-w-lg mx-auto flex">${navItems.map(item => `<button onclick="APP.currentModule = '${item.id}'; render();" class="flex-1 py-3 flex flex-col items-center gap-1 transition-colors ${APP.currentModule === item.id || (item.id === 'questions' && APP.currentModule === 'editQuestions') ? (APP.activeSubsystem === 'QLCL' ? 'text-blue-600 bg-blue-50' : 'text-purple-600 bg-purple-50') : 'text-gray-500 hover:text-gray-700'}"><i class="fas ${item.icon} text-xl"></i><span class="text-xs">${item.label}</span></button>`).join('')}</div></div>
                ${APP.loading ? `<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"><div class="bg-white rounded-2xl p-6 text-center"><i class="fas fa-spinner spinner text-3xl text-blue-500 mb-2"></i><p class="text-gray-600">Đang xử lý...</p></div></div>` : ''}
                ${APP.notification ? `<div class="fixed top-20 left-4 right-4 max-w-lg mx-auto p-4 rounded-xl shadow-lg flex items-center gap-3 toast ${APP.notification.type === 'error' ? 'bg-red-500' : 'bg-green-500'} text-white z-50"><i class="fas ${APP.notification.type === 'error' ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i><span>${APP.notification.message}</span></div>` : ''}
            `;
        };

        // ===================== INIT =====================
        const init = async () => {
            if (!firebaseReady) {
                document.getElementById('app').innerHTML = `<div class="min-h-screen flex items-center justify-center p-4"><div class="bg-white rounded-3xl shadow-xl p-8 max-w-md"><div class="text-center mb-6"><div class="w-20 h-20 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fas fa-exclamation-triangle text-yellow-500 text-3xl"></i></div><h2 class="text-xl font-bold text-gray-800">Cấu hình Firebase</h2></div><div class="bg-gray-50 rounded-xl p-4 text-sm text-gray-600 space-y-2"><p>1. Tạo project tại <a href="https://console.firebase.google.com" target="_blank" class="text-blue-500">Firebase Console</a></p><p>2. Tạo Firestore Database</p><p>3. Copy cấu hình vào file HTML</p><p>4. Mở lại ứng dụng</p></div><div class="mt-4 p-3 bg-green-50 rounded-xl border border-green-200"><p class="text-xs text-green-700"><i class="fas fa-check-circle mr-1"></i>Không cần bật Authentication!</p></div></div></div>`;
                return;
            }
            try { await initializeAdmin(); const ok = await checkSession(); if (ok) await loadAllData(); } catch (e) { console.error('Init:', e); }
            render();
        };

        init();
    </script>
</body>

</html>
